# ==============================================================================
# E-Cell Examination Portal - High-Availability HAProxy Configuration
# Location: /etc/haproxy/haproxy.cfg
# ==============================================================================

global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    user haproxy
    group haproxy
    daemon
    maxconn 10000

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor
    option  http-server-close
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms
    retries 3

# ------------------------------------------------------------------------------
# FRONTEND - PUBLIC ENTRY POINT
# ------------------------------------------------------------------------------
frontend ecell_frontend
    bind *:80
    bind *:443 ssl crt /etc/ssl/certs/ecell.pem alpn h2,http/1.1
    redirect scheme https if !{ ssl_fc }

    # Security headers
    http-response set-header X-Frame-Options DENY
    http-response set-header X-Content-Type-Options nosniff
    http-response set-header Referrer-Policy strict-origin-when-cross-origin

    default_backend ecell_cluster

# ------------------------------------------------------------------------------
# BACKEND - LOAD BALANCED WORKER CLUSTER
# ------------------------------------------------------------------------------
backend ecell_cluster
    balance leastconn
    cookie ECELL_SRV insert indirect nocache

    # Health check endpoint
    option httpchk GET /api/public/exam
    http-check expect status 200

    # Cluster workers (Active-Active with Auto-Failover)
    server worker1 127.0.0.1:8001 check inter 2s fall 2 rise 2 cookie w1
    server worker2 127.0.0.1:8002 check inter 2s fall 2 rise 2 cookie w2
    server worker3 127.0.0.1:8003 check inter 2s fall 2 rise 2 cookie w3
    server worker4 127.0.0.1:8004 check inter 2s fall 2 rise 2 cookie w4

# ------------------------------------------------------------------------------
# REAL-TIME METRICS & MONITORING DASHBOARD (Port 8404)
# ------------------------------------------------------------------------------
listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s
    stats admin if TRUE
    stats auth admin:Ecell@Cluster2026!
