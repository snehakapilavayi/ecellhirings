# ==============================================================================
# E-Cell Examination Portal - High Concurrency Nginx Configuration (200+ Users)
# Location: /etc/nginx/sites-available/ecell.conf
# ==============================================================================

# Rate limit zone to protect against abusive DDoS scrapers (allows burst for exam operations)
limit_req_zone $binary_remote_addr zone=exam_limit:10m rate=40r/s;

# ------------------------------------------------------------------------------
# MULTI-WORKER LOAD BALANCER POOL (Active-Active Cluster)
# ------------------------------------------------------------------------------
upstream ecell_cluster {
    least_conn; # Routes traffic to the worker with fewest active requests

    server 127.0.0.1:8001 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8002 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8003 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8004 max_fails=3 fail_timeout=10s;

    keepalive 64; # High-performance persistent connection pooling
}

server {
    listen 80;
    server_name exam.yourcollegeecell.com;

    # Redirect all plain HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name exam.yourcollegeecell.com;

    # SSL Certificate (managed by certbot --nginx)
    # ssl_certificate /etc/letsencrypt/live/exam.yourcollegeecell.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/exam.yourcollegeecell.com/privkey.pem;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Global connection & buffer settings for 500+ simultaneous connections
    client_max_body_size 15M;
    client_body_buffer_size 128k;
    keepalive_timeout 65;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # High-performance Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --------------------------------------------------------------------------
    # 1. SERVE STATIC ASSETS DIRECTLY (Zero Python Overhead for 200+ users)
    # --------------------------------------------------------------------------
    location /static/ {
        alias /var/www/ecell-portal/static/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # 2. LOAD-BALANCED API & DYNAMIC ENDPOINTS WITH ZERO-DOWNTIME FAILOVER
    # --------------------------------------------------------------------------
    location / {
        limit_req zone=exam_limit burst=80 nodelay;

        proxy_pass http://ecell_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Real Client IP propagation for proctoring audit trails
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Transparent Failover (If any worker dies, instantly route to next worker)
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 5s;

        # Proxy buffer tuning for fast responses under load
        proxy_buffers 16 16k;
        proxy_buffer_size 16k;
        proxy_busy_buffers_size 32k;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
