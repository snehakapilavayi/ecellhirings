upstream ecell_cluster {
    least_conn;
    server worker1:8001 max_fails=3 fail_timeout=10s;
    server worker2:8002 max_fails=3 fail_timeout=10s;
    server worker3:8003 max_fails=3 fail_timeout=10s;
    server worker4:8004 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 15M;

    # Static assets
    location /static/ {
        alias /var/www/ecell-portal/static/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # API & Dynamic routes with failover
    location / {
        proxy_pass http://ecell_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
    }
}
