version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # LOAD BALANCER (Nginx Reverse Proxy & SSL Termination)
  # ----------------------------------------------------------------------------
  load_balancer:
    image: nginx:alpine
    container_name: ecell_lb
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/docker.nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/var/www/ecell-portal/static:ro
    depends_on:
      - worker1
      - worker2
      - worker3
      - worker4

  # ----------------------------------------------------------------------------
  # CLUSTER WORKER NODES (Active-Active)
  # ----------------------------------------------------------------------------
  worker1:
    build: .
    container_name: ecell_worker_1
    restart: always
    environment:
      - ECELL_HOST=0.0.0.0
      - ECELL_PORT=8001
      - ECELL_TRUST_PROXY=1
      - ECELL_COOKIE_SECURE=1
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8001/api/public/exam"]
      interval: 10s
      timeout: 3s
      retries: 3

  worker2:
    build: .
    container_name: ecell_worker_2
    restart: always
    environment:
      - ECELL_HOST=0.0.0.0
      - ECELL_PORT=8002
      - ECELL_TRUST_PROXY=1
      - ECELL_COOKIE_SECURE=1
      - ECELL_DISABLE_SWEEPER=1
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8002/api/public/exam"]
      interval: 10s
      timeout: 3s
      retries: 3

  worker3:
    build: .
    container_name: ecell_worker_3
    restart: always
    environment:
      - ECELL_HOST=0.0.0.0
      - ECELL_PORT=8003
      - ECELL_TRUST_PROXY=1
      - ECELL_COOKIE_SECURE=1
      - ECELL_DISABLE_SWEEPER=1
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8003/api/public/exam"]
      interval: 10s
      timeout: 3s
      retries: 3

  worker4:
    build: .
    container_name: ecell_worker_4
    restart: always
    environment:
      - ECELL_HOST=0.0.0.0
      - ECELL_PORT=8004
      - ECELL_TRUST_PROXY=1
      - ECELL_COOKIE_SECURE=1
      - ECELL_DISABLE_SWEEPER=1
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8004/api/public/exam"]
      interval: 10s
      timeout: 3s
      retries: 3
