services:
  - type: web
    name: ecell-hirings
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python server.py"
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ECELL_TRUST_PROXY
        value: "1"
      - key: ECELL_COOKIE_SECURE
        value: "1"
      - key: ECELL_SESSION_HOURS
        value: "4"
      - key: SUPABASE_URL
        value: "https://mshgbofevaztfnwqdusq.supabase.co"
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: ECELL_ADMIN_SETUP_CODE
        value: "Ecell@Hirings2026!"
